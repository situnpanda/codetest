apiVersion: v1
kind: Service
metadata:
  name: itelemetry-backend-service
  namespace: {{ .Values.namespace }}
  labels:
    app: itelemetry-backend
    component: backend
spec:
  selector:
    app: itelemetry-backend
    component: backend
  ports:
  - name: http
    port: {{ .Values.backend.service.port }}
    targetPort: {{ .Values.backend.service.targetPort }}
    protocol: TCP
  type: {{ .Values.backend.service.type }}
---
apiVersion: v1
kind: Service
metadata:
  name: itelemetry-frontend-service
  namespace: {{ .Values.namespace }}
  labels:
    app: itelemetry-frontend
    component: frontend
spec:
  selector:
    app: itelemetry-frontend
    component: frontend
  ports:
  - name: http
    port: {{ .Values.frontend.service.port }}
    targetPort: {{ .Values.frontend.service.targetPort }}
    protocol: TCP
  type: {{ .Values.frontend.service.type }}

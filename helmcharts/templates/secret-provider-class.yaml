{{- if .Values.secretProviderClass.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.secretProviderClass.name }}
  namespace: {{ .Values.namespace }}
spec:
  provider: azure
  secretObjects:
  - secretName: {{ .Values.secretProviderClass.secretName }}
    type: kubernetes.io/tls
    data:
    - key: tls.key
      objectName: {{ .Values.secretProviderClass.objectName }}
    - key: tls.crt
      objectName: {{ .Values.secretProviderClass.objectName }}
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: {{ .Values.azure.clientId | quote }}
    keyvaultName: {{ .Values.secretProviderClass.keyvaultName | quote }}
    objects: |
      array:
        - |
          objectName: {{ .Values.secretProviderClass.objectName }}
          objectType: secret
          objectVersion: ""
    tenantId: {{ .Values.azure.tenantId | quote }}
{{- end }}

# Staging Promotion
# -----------------
# Promotes an ALREADY-BUILT image to staging. No image is built here.
# Run manually (workflow_dispatch). By default it promotes the exact tag that is
# currently deployed in dev (read from values-dev.yaml); you may override it with
# an explicit image_tag input.
#
# Approval model (GitOps / Option 2): this workflow does NOT push to the
# helmcharts branch directly. It opens a Pull Request that updates
# values-stag.yaml. A reviewer (enforced by CODEOWNERS on the helmcharts branch)
# must approve + merge the PR; merging is what deploys to staging.
name: Staging Deployment

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to promote (blank = promote the tag currently in dev)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  REGISTRY: artifactory.wu2.cloud.providence.org
  IMAGE_BASE: artifactory.wu2.cloud.providence.org/docker-itelemetryplatformengineering
  HELM_BRANCH: helmcharts
  TARGET_VALUES: helmcharts/values-stag.yaml
  SOURCE_VALUES: helmcharts/values-dev.yaml

jobs:
  promote:
    runs-on: prov-wu2-ubuntu24-arty-toolbox-toolset1-v3
    steps:
      - name: Checkout Helm Branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.HELM_BRANCH }}
          fetch-depth: 0

      - name: Resolve Image Tag
        # Use the supplied tag, else fall back to the tag currently running in dev.
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(grep -m1 'tag:' ./${{ env.SOURCE_VALUES }} | awk '{print $2}' | tr -d '"')
            echo "No tag supplied; promoting the tag currently in dev: ${TAG}"
          fi
          if [ -z "$TAG" ]; then
            echo "::error::Could not resolve an image tag to promote."
            exit 1
          fi
          echo "IMAGE_TAG=${TAG}" >> $GITHUB_ENV
          echo "Promoting tag: ${TAG}"

      - name: Login to JFrog Artifactory
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: sp-itelemetryplatformengineering-publisher
          password: "${{ secrets.JFROG_TOKEN_SP }}"

      - name: Verify Images Exist (promote, never rebuild)
        run: |
          echo "Verifying backend + frontend images exist for tag ${IMAGE_TAG}..."
          docker manifest inspect ${{ env.IMAGE_BASE }}/itelemetry-backend:${IMAGE_TAG} > /dev/null
          docker manifest inspect ${{ env.IMAGE_BASE }}/itelemetry-frontend:${IMAGE_TAG} > /dev/null
          echo "OK: both images exist for tag ${IMAGE_TAG}"

      - name: Open Staging Promotion PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="promote/staging-${IMAGE_TAG}"
          git config user.name "itelemetry-promotion-bot"
          git config user.email "itelemetry-promotion-bot@users.noreply.github.com"
          git checkout -B "$BRANCH"
          sed -i -e 's/tag: .*/tag: '"${IMAGE_TAG}"'/' ./${{ env.TARGET_VALUES }}
          git add ./${{ env.TARGET_VALUES }}
          if git diff --cached --quiet; then
            echo "Staging is already on ${IMAGE_TAG}; nothing to promote."
            exit 0
          fi
          git commit -m "Promote ${IMAGE_TAG} to staging"
          git push --force-with-lease origin "$BRANCH"
          gh pr create \
            --base "${{ env.HELM_BRANCH }}" \
            --head "$BRANCH" \
            --title "Promote ${IMAGE_TAG} -> staging" \
            --body "Promotes the already-built image \`${IMAGE_TAG}\` to **staging** by updating \`values-stag.yaml\`. No rebuild. Merging this PR deploys to staging." \
            || echo "A PR for ${BRANCH} may already exist; updated the branch."

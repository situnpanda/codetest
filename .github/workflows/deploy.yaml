name: iTelemetry Deployment

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  REGISTRY: artifactory.wu2.cloud.providence.org
  IMAGE_BASE: artifactory.wu2.cloud.providence.org/docker-itelemetryplatformengineering
  HELM_BRANCH: helmcharts
  RELEASE_VERSION_FLOOR: v2.0.0   # first release version; versions never go below this

jobs:
  # ---------------------------------------------------------------------------
  # 1. BUILD (the only job that builds images)
  # ---------------------------------------------------------------------------
  build:
    runs-on: prov-wu2-ubuntu24-arty-toolbox-toolset1-v3
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Format Image Tag
        id: tag
        run: |
          date=$(date +%d.%m.%y)
          short_sha=$(echo ${{ github.sha }} | cut -c1-7)
          IMAGE_TAG="release-${date}-${short_sha}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Generated tag: ${IMAGE_TAG}"

      - name: Login to JFrog Artifactory
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: sp-itelemetryplatformengineering-publisher
          password: "${{ secrets.JFROG_TOKEN_SP }}"

      - name: Build and Push Backend Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_BASE }}/itelemetry-backend:${{ steps.tag.outputs.image_tag }}
          cache-from: type=registry,ref=${{ env.IMAGE_BASE }}/itelemetry-backend:cache
          cache-to: type=registry,ref=${{ env.IMAGE_BASE }}/itelemetry-backend:cache,mode=max

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_BASE }}/itelemetry-frontend:${{ steps.tag.outputs.image_tag }}
          cache-from: type=registry,ref=${{ env.IMAGE_BASE }}/itelemetry-frontend:cache
          cache-to: type=registry,ref=${{ env.IMAGE_BASE }}/itelemetry-frontend:cache,mode=max

  # ---------------------------------------------------------------------------
  # 2. DEPLOY TO DEV (automatic, after merge to main)
  # ---------------------------------------------------------------------------
  deploy-dev:
    needs: build
    runs-on: prov-wu2-ubuntu24-arty-toolbox-toolset1-v3
    environment: dev
    env:
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
      VALUES_FILE: helmcharts/values-dev.yaml
    steps:
      - name: Checkout Helm Branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.HELM_BRANCH }}
          fetch-depth: 0

      - name: Login to JFrog Artifactory
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: sp-itelemetryplatformengineering-publisher
          password: "${{ secrets.JFROG_TOKEN_SP }}"

      - name: Verify Images Exist
        run: |
          echo "Verifying images for tag ${IMAGE_TAG}..."
          docker manifest inspect ${{ env.IMAGE_BASE }}/itelemetry-backend:${IMAGE_TAG} > /dev/null
          docker manifest inspect ${{ env.IMAGE_BASE }}/itelemetry-frontend:${IMAGE_TAG} > /dev/null
          echo "OK: both images exist."

      - name: Update values-dev.yaml
        run: |
          git config user.name "itelemetry-deploy-bot"
          git config user.email "itelemetry-deploy-bot@users.noreply.github.com"
          sed -i -e 's|tag: .*|tag: '"${IMAGE_TAG}"'|g' ./${{ env.VALUES_FILE }}
          git add ./${{ env.VALUES_FILE }}
          if git diff --cached --quiet; then
            echo "Dev already on ${IMAGE_TAG}; nothing to update."
            exit 0
          fi
          git commit -m "Deploy ${IMAGE_TAG} to dev"
          git push origin ${{ env.HELM_BRANCH }}
          echo "Dev image tag set to ${IMAGE_TAG}"

  # ---------------------------------------------------------------------------
  # 3. DEPLOY TO STAGING (needs dev; waits for approval)
  # ---------------------------------------------------------------------------
  deploy-staging:
    needs: [ build, deploy-dev ]
    runs-on: prov-wu2-ubuntu24-arty-toolbox-toolset1-v3
    environment: staging          # <-- configure Required reviewers on this environment
    env:
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
      VALUES_FILE: helmcharts/values-stag.yaml
    steps:
      - name: Checkout Helm Branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.HELM_BRANCH }}
          fetch-depth: 0

      - name: Login to JFrog Artifactory
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: sp-itelemetryplatformengineering-publisher
          password: "${{ secrets.JFROG_TOKEN_SP }}"

      - name: Verify Images Exist (promote, never rebuild)
        run: |
          docker manifest inspect ${{ env.IMAGE_BASE }}/itelemetry-backend:${IMAGE_TAG} > /dev/null
          docker manifest inspect ${{ env.IMAGE_BASE }}/itelemetry-frontend:${IMAGE_TAG} > /dev/null
          echo "OK: both images exist for tag ${IMAGE_TAG}"

      - name: Update values-stag.yaml
        run: |
          git config user.name "itelemetry-deploy-bot"
          git config user.email "itelemetry-deploy-bot@users.noreply.github.com"
          sed -i -e 's|tag: .*|tag: '"${IMAGE_TAG}"'|g' ./${{ env.VALUES_FILE }}
          git add ./${{ env.VALUES_FILE }}
          if git diff --cached --quiet; then
            echo "Staging already on ${IMAGE_TAG}; nothing to update."
            exit 0
          fi
          git commit -m "Promote ${IMAGE_TAG} to staging"
          git push origin ${{ env.HELM_BRANCH }}
          echo "Staging image tag set to ${IMAGE_TAG}"

  # ---------------------------------------------------------------------------
  # 4. DEPLOY TO PROD (needs staging; waits for approval)
  # ---------------------------------------------------------------------------
  deploy-prod:
    needs: [ build, deploy-staging ]
    runs-on: prov-wu2-ubuntu24-arty-toolbox-toolset1-v3
    environment: production        # <-- configure Required reviewers on this environment
    env:
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
      VALUES_FILE: helmcharts/values-prod.yaml
    steps:
      - name: Checkout Helm Branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.HELM_BRANCH }}
          fetch-depth: 0

      - name: Login to JFrog Artifactory
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: sp-itelemetryplatformengineering-publisher
          password: "${{ secrets.JFROG_TOKEN_SP }}"

      - name: Verify Images Exist (promote, never rebuild)
        run: |
          docker manifest inspect ${{ env.IMAGE_BASE }}/itelemetry-backend:${IMAGE_TAG} > /dev/null
          docker manifest inspect ${{ env.IMAGE_BASE }}/itelemetry-frontend:${IMAGE_TAG} > /dev/null
          echo "OK: both images exist for tag ${IMAGE_TAG}"

      - name: Update values-prod.yaml
        run: |
          git config user.name "itelemetry-deploy-bot"
          git config user.email "itelemetry-deploy-bot@users.noreply.github.com"
          sed -i -e 's|tag: .*|tag: '"${IMAGE_TAG}"'|g' ./${{ env.VALUES_FILE }}
          git add ./${{ env.VALUES_FILE }}
          if git diff --cached --quiet; then
            echo "Prod already on ${IMAGE_TAG}; nothing to update."
            exit 0
          fi
          git commit -m "Promote ${IMAGE_TAG} to production"
          git push origin ${{ env.HELM_BRANCH }}
          echo "Production image tag set to ${IMAGE_TAG}"

      # Release versioning: the commit that reaches production gets the next
      # semantic version tag (vMAJOR.MINOR.PATCH) on main. Patch bump by default;
      # put "#minor" or "#major" in the merge commit message (squash: the PR title)
      # to bump those instead. A commit that already has a v* tag (e.g. a rollback
      # re-run) keeps its existing version. Versions start at RELEASE_VERSION_FLOOR.
      - name: Tag release on main
        id: release
        run: |
          set -euo pipefail
          git config user.name "itelemetry-deploy-bot"
          git config user.email "itelemetry-deploy-bot@users.noreply.github.com"
          git fetch --force --tags origin main

          existing=$(git tag --points-at "${GITHUB_SHA}" --list 'v*' --sort=-v:refname | head -n1)
          if [ -n "${existing}" ]; then
            echo "Commit ${GITHUB_SHA::7} is already released as ${existing}; not creating a new version."
            echo "version=${existing}" >> "$GITHUB_OUTPUT"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::warning::Commit ${GITHUB_SHA::7} is not on main; skipping release tag."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          last=${last:-v0.0.0}
          IFS=. read -r major minor patch <<< "${last#v}"
          msg=$(git log -1 --format=%B "${GITHUB_SHA}")
          if   grep -q '#major' <<< "${msg}"; then major=$((major + 1)); minor=0; patch=0
          elif grep -q '#minor' <<< "${msg}"; then minor=$((minor + 1)); patch=0
          else patch=$((patch + 1)); fi
          VERSION="v${major}.${minor}.${patch}"

          lowest=$(printf '%s\n' "${VERSION#v}" "${RELEASE_VERSION_FLOOR#v}" | sort -V | head -n1)
          if [ "${VERSION}" != "${RELEASE_VERSION_FLOOR}" ] && [ "${lowest}" = "${VERSION#v}" ]; then
            echo "Computed ${VERSION} is below floor ${RELEASE_VERSION_FLOOR}; using ${RELEASE_VERSION_FLOOR}."
            VERSION="${RELEASE_VERSION_FLOOR}"
          fi

          git tag -a "${VERSION}" "${GITHUB_SHA}" -m "Release ${VERSION} (image ${IMAGE_TAG})"
          git push origin "refs/tags/${VERSION}"
          echo "Created and pushed ${VERSION} (previous: ${last}) for image ${IMAGE_TAG}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Add release version to images (no rebuild)
        if: steps.release.outputs.created == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          for img in itelemetry-backend itelemetry-frontend; do
            docker buildx imagetools create \
              --tag "${IMAGE_BASE}/${img}:${VERSION}" \
              "${IMAGE_BASE}/${img}:${IMAGE_TAG}"
            echo "${img}:${VERSION} -> same digest as ${img}:${IMAGE_TAG}"
          done

      - name: Create GitHub Release
        if: steps.release.outputs.created == 'true'
        continue-on-error: true   # cosmetic; prod is already deployed and tagged
        env:
          VERSION: ${{ steps.release.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases" \
            -d "{\"tag_name\":\"${VERSION}\",\"name\":\"${VERSION}\",\"body\":\"Image tag: ${IMAGE_TAG}\\nCommit: ${GITHUB_SHA}\",\"generate_release_notes\":true}" \
            > /dev/null
          echo "GitHub Release ${VERSION} created."

      - name: Release summary
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          {
            echo "### Production deployment"
            echo ""
            echo "| Version | Image tag | Commit | Environment |"
            echo "|---------|-----------|--------|-------------|"
            echo "| ${VERSION:-n/a} | ${IMAGE_TAG} | ${GITHUB_SHA::7} | production |"
          } >> "$GITHUB_STEP_SUMMARY"

name: Development Deployment

on:
  push:
    branches: [ "Development" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  REGISTRY: artifactory.wu2.cloud.providence.org
  IMAGE_BASE: artifactory.wu2.cloud.providence.org/docker-itelemetryplatformengineering
  ENVIRONMENT: dev
  HELM_BRANCH: helmcharts
  VALUES_FILE: helmcharts/values-dev.yaml

jobs:
  build:
    runs-on: prov-wu2-ubuntu24-arty-toolbox-toolset1-v3
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Format Image Tag
        run: |
          date=$(date +%Y%m%d)
          short_sha=$(echo ${{ github.sha }} | cut -c1-7)
          IMAGE_TAG="${{ env.ENVIRONMENT }}-v${{ github.run_number }}-${date}-${short_sha}"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          echo "Generated tag: ${IMAGE_TAG}"

      - name: Login to JFrog Artifactory
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: sp-itelemetryplatformengineering-publisher
          password: "${{ secrets.JFROG_TOKEN_SP }}"

      - name: Build and Push Backend Image
        id: backend-build
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_BASE }}/itelemetry-backend:${{ env.IMAGE_TAG }}
          cache-from: type=registry,ref=${{ env.IMAGE_BASE }}/itelemetry-backend:cache
          cache-to: type=registry,ref=${{ env.IMAGE_BASE }}/itelemetry-backend:cache,mode=max

      - name: Build and Push Frontend Image
        id: frontend-build
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_BASE }}/itelemetry-frontend:${{ env.IMAGE_TAG }}
          cache-from: type=registry,ref=${{ env.IMAGE_BASE }}/itelemetry-frontend:cache
          cache-to: type=registry,ref=${{ env.IMAGE_BASE }}/itelemetry-frontend:cache,mode=max

      - name: Update Helm Charts
        if: steps.backend-build.outcome == 'success' && steps.frontend-build.outcome == 'success'
        run: |
          git fetch origin ${{ env.HELM_BRANCH }}
          git checkout ${{ env.HELM_BRANCH }}
          sed -i -e 's/tag: .*/tag: '"${{ env.IMAGE_TAG }}"'/' ./${{ env.VALUES_FILE }}
          echo "git diff"
          git diff
          git config user.name "workflow (triggered by $(git log -n 1 --format=%ae))"
          git config user.email "$(git log -n 1 --format=%ae)"
          git add ./${{ env.VALUES_FILE }}
          git diff-index --quiet HEAD || git commit -m "Update ${{ env.ENVIRONMENT }} images to ${{ env.IMAGE_TAG }}"
          git push origin ${{ env.HELM_BRANCH }}
          echo "Image tag updated to ${{ env.IMAGE_TAG }}"

# Development Deployment
# -----------------------
# Build-once / promote-same-artifact model.
# This is the ONLY workflow that builds images. It runs on every push to main,
# builds the backend + frontend ONCE, tags them with a single environment-neutral
# tag (vRUN-DATE-SHA) and auto-deploys to DEV by updating values-dev.yaml.
# The exact same tag is later promoted to staging/prod (no rebuild) by the
# staging-deployment.yaml / production-deployment.yaml promotion workflows.
name: Development Deployment

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  REGISTRY: artifactory.wu2.cloud.providence.org
  IMAGE_BASE: artifactory.wu2.cloud.providence.org/docker-itelemetryplatformengineering
  HELM_BRANCH: helmcharts
  VALUES_FILE: helmcharts/values-dev.yaml

jobs:
  build:
    runs-on: prov-wu2-ubuntu24-arty-toolbox-toolset1-v3
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Format Image Tag
        # Environment-neutral, immutable tag shared by every environment.
        run: |
          date=$(date +%Y%m%d)
          short_sha=$(echo ${{ github.sha }} | cut -c1-7)
          IMAGE_TAG="v${{ github.run_number }}-${date}-${short_sha}"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          echo "Generated tag: ${IMAGE_TAG}"

      - name: Login to JFrog Artifactory
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: sp-itelemetryplatformengineering-publisher
          password: "${{ secrets.JFROG_TOKEN_SP }}"

      - name: Build and Push Backend Image
        id: backend-build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_BASE }}/itelemetry-backend:${{ env.IMAGE_TAG }}
          cache-from: type=registry,ref=${{ env.IMAGE_BASE }}/itelemetry-backend:cache
          cache-to: type=registry,ref=${{ env.IMAGE_BASE }}/itelemetry-backend:cache,mode=max

      - name: Build and Push Frontend Image
        id: frontend-build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_BASE }}/itelemetry-frontend:${{ env.IMAGE_TAG }}
          cache-from: type=registry,ref=${{ env.IMAGE_BASE }}/itelemetry-frontend:cache
          cache-to: type=registry,ref=${{ env.IMAGE_BASE }}/itelemetry-frontend:cache,mode=max

      - name: Deploy to Dev (auto-update values-dev.yaml)
        if: steps.backend-build.outcome == 'success' && steps.frontend-build.outcome == 'success'
        run: |
          git fetch origin ${{ env.HELM_BRANCH }}
          git checkout ${{ env.HELM_BRANCH }}
          sed -i -e 's/tag: .*/tag: '"${{ env.IMAGE_TAG }}"'/' ./${{ env.VALUES_FILE }}
          echo "git diff"
          git diff
          git config user.name "workflow (triggered by $(git log -n 1 --format=%ae))"
          git config user.email "$(git log -n 1 --format=%ae)"
          git add ./${{ env.VALUES_FILE }}
          git diff-index --quiet HEAD || git commit -m "Deploy ${{ env.IMAGE_TAG }} to dev"
          git push origin ${{ env.HELM_BRANCH }}
          echo "Dev image tag updated to ${{ env.IMAGE_TAG }}"
